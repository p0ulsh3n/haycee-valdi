name: Valdi Android build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  android:
    runs-on: ubuntu-24.04
    # A completely cold Valdi Android build can exceed 40 minutes.  The
    # cache below is populated only after a successful first build, so this
    # must leave enough time for that seed run to finish.
    timeout-minutes: 120
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install the pinned Valdi CLI
        run: npm install --global @snap/valdi@1.0.11

      - name: Restore Bazel caches
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/bazel/disk
            ~/.cache/bazel/repo
            ~/.cache/bazelisk
          # A unique key lets every successful run save the newer action
          # results; the restore prefix selects the most recent compatible
          # cache on the next GitHub-hosted runner.
          key: valdi-bazel-${{ runner.os }}-${{ hashFiles('WORKSPACE', 'BUILD.bazel', '.bazelrc', 'modules/**/BUILD.bazel') }}-${{ github.run_id }}
          restore-keys: |
            valdi-bazel-${{ runner.os }}-${{ hashFiles('WORKSPACE', 'BUILD.bazel', '.bazelrc', 'modules/**/BUILD.bazel') }}-

      - name: Set up Valdi dependencies
        shell: bash
        run: |
          for attempt in 1 2 3; do
            echo "Valdi dependency setup attempt ${attempt}/3"
            if valdi dev_setup; then
              exit 0
            else
              status=$?
              echo "valdi dev_setup failed with exit code ${status}"
            fi
            if [ "${attempt}" -lt 3 ]; then
              echo 'Retrying after a short delay...'
              sleep 10
            fi
          done
          exit 1

      - name: Install Valdi compiler compatibility library
        shell: bash
        run: |
          if ldconfig -p | grep -q 'libtinfo\.so\.5'; then
            echo 'libtinfo.so.5 is already available.'
            exit 0
          fi

          echo 'Installing libtinfo5 required by the Valdi LLVM toolchain...'
          if sudo apt-get update && sudo apt-get install -y libtinfo5; then
            exit 0
          fi

          archive_url='https://archive.ubuntu.com/ubuntu/pool/universe/n/ncurses'
          archive_listing="$(curl -fsSL "${archive_url}/")"
          deb_name="$(printf '%s\n' "${archive_listing}" | grep -oE 'libtinfo5_[^" ]*_amd64\.deb' | sort -Vu | tail -n1 || true)"
          if [ -z "${deb_name}" ]; then
            echo 'Could not locate a compatible libtinfo5 package.' >&2
            exit 1
          fi

          curl -fsSL "${archive_url}/${deb_name}" -o "/tmp/${deb_name}"
          sudo apt-get install -y "/tmp/${deb_name}"
          rm -f "/tmp/${deb_name}"
          ldconfig -p | grep -q 'libtinfo\.so\.5'

      - name: Check the Valdi environment
        run: valdi doctor

      - name: Synchronize the project
        run: valdi projectsync

      - name: Build the Android arm64 package
        shell: bash
        run: |
          # The pinned CLI's package command intentionally builds all Android ABIs.
          # CI only needs the arm64 APK used by a current physical Android device.
          "$HOME/.valdi/bin/bazelisk" build //:haycee_mobile_app_valdi_app_android \
            --copt=-DANDROID_WITH_JNI \
            --repo_env=VALDI_PLATFORM_DEPENDENCIES=android \
            --disk_cache="$HOME/.cache/bazel/disk" \
            --repository_cache="$HOME/.cache/bazel/repo" \
            --define=client_repo_arm64=true \
            --fat_apk_cpu=arm64-v8a \
            --android_cpu=arm64-v8a

          mkdir -p dist
          apk='bazel-bin/haycee_mobile_app_valdi_app_android.apk'
          test -f "${apk}"
          cp "${apk}" dist/haycee-mobile-app-valdi-arm64.apk

      - name: Upload Android package
        uses: actions/upload-artifact@v4
        with:
          name: haycee-mobile-app-valdi-android-arm64
          path: dist/haycee-mobile-app-valdi-arm64.apk
          if-no-files-found: error
